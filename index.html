<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Mineblogcraft：Minecraft 风格的个人技术博客，汇集 AI、网络安全、软件工程文章、论文和知识百科。"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Mineblogcraft — Personal Blog Edition</title>
    <link rel="icon" href="data:," />
    <style>
      /* Present before the JavaScript bundle starts: no flash of the menu. */
      #startup-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #ef323d;
        display: grid;
        place-items: center;
        opacity: 1;
      }
      #startup-loader .startup-logo {
        width: min(75vw, 100vh);
        height: auto;
        aspect-ratio: 4;
        object-fit: contain;
      }
      #startup-loader .startup-progress {
        position: absolute;
        top: 83.25%;
        left: 50%;
        transform: translateX(-50%);
        width: min(75vw, 100vh);
        height: 10px;
        padding: 2px;
        border: 2px solid white;
        box-sizing: border-box;
      }
      #startup-loader .startup-progress-fill {
        display: block;
        width: calc(var(--startup-progress, 0) * 100%);
        height: 100%;
        background: white;
        transition: width 120ms linear;
      }
      #startup-loader[data-phase="fading"] {
        opacity: 0;
        transition: opacity 1000ms linear;
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-loader[data-phase="fading"] {
          transition-duration: 150ms;
        }
        #startup-loader .startup-progress-fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="startup-loader"
      data-phase="loading"
      role="status"
      aria-label="网站正在加载"
      aria-live="polite"
    >
      <img
        class="startup-logo"
        src="/assets/inventory/mojang-studios-logo.png"
        alt="Mojang Studios"
      />
      <div
        class="startup-progress"
        role="progressbar"
        aria-label="首页资源加载进度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span class="startup-progress-fill"></span>
      </div>
    </div>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

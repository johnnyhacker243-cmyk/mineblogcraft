<svg xmlns="http://www.w3.org/2000/svg" width="620" height="220" viewBox="0 0 620 220"><g fill="#292019" font-family="serif" text-anchor="middle"><text x="310" y="65" font-size="32">t(x;r) = x² / [4D ln(1/r)]</text><text x="310" y="125" font-size="32">t₂ / t₁ = (x₂ / x₁)²</text><text x="310" y="182" font-size="24">0 &lt; r &lt; 1,  x₁ ≠ 0</text></g></svg>
